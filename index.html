<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03060e" />
    <meta name="description" content="Youhua School Model United Nations opens with fifteen founding seats. Claim one before the charter is sealed, or stand on the record as a Founding Delegate." />
    <meta name="keywords" content="Model United Nations, MUN, Founding Member, Leadership, Debate, Diplomacy" />
    <title>Youhua MUN · Founding Member Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Display: Bodoni Moda, a burin-cut Didone that reads as engraved brass.
         Text: Archivo, the institutional grotesque of printed forms and signage. -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Archivo:wght@400..800&display=swap" rel="stylesheet">
    <!-- Traditional Chinese. Bodoni and Archivo carry no CJK glyphs, so the
         Chinese setting needs its own pair: Noto Serif TC answers the Didone
         display, Noto Sans TC the grotesque text. Loaded lazily, because an
         English reader should never pay for a CJK font they will not see. -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400..700&family=Noto+Serif+TC:wght@400..700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400..700&family=Noto+Serif+TC:wght@400..700&display=swap">
    </noscript>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="intro-active">
    <div id="root"></div>
    <script>
      /* Hard fail-safe: the intro must never permanently darken the page. */
      setTimeout(function () { document.body.classList.remove('intro-active'); }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
